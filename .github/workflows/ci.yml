name: CI — Tests, Security & Build

on:
  pull_request:
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit, security & negative schema tests
        run: npm test

      - name: Validate data, scan for leaks and build static site
        run: npm run build

      - name: Verify agent dry-run configuration
        run: npm run agent:dry-run
