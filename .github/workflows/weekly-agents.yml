name: Weekly AI Knowledge Expansion Agents

on:
  schedule:
    # Elke maandag 07:00 UTC (lokaal Appfigures-script draait apart op dinsdag 08:00 CET)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      agent:
        description: "Welke engine draaien? ('all' voor alle 12 samenwerkende engines)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - money-leak-detector
          - competitor-complaint-miner
          - demand-wtp-validator
          - regulation-deadline-scout
          - distribution-arbitrage-analyst
          - agency-to-saas-builder
          - acquisition-partnership-scout
          - customer-acquisition-sales-strategist
          - pricing-unit-economics-analyst
          - experiment-kill-criteria-analyst
          - evidence-quality-auditor
          - portfolio-capital-allocator

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  expand-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cooperating weekly expansion engines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RUN_COST_USD: "0.50"
        run: |
          TARGET="${{ github.event.inputs.agent || 'all' }}"
          if [ "$TARGET" = "all" ]; then
            node agents/run-weekly-expansion.mjs --all
          else
            node agents/run-weekly-expansion.mjs --agent "$TARGET"
          fi

      - name: Run full test suite, leak scan & build
        run: npm test && npm run build

      - name: Create Pull Request with weekly findings
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(agents): wekelijkse Playbook 2.0/3.0 uitbreiding"
          title: "Wekelijkse AI Playbook-uitbreiding (Cloud Engines)"
          body: |
            ## Automatische wekelijkse uitbreiding (Cloud Engines)

            - Alle 12 samenwerkende engines gebruikten gedeelde research-pools met prompt-injectionbescherming en kostenplafond.
            - Volledige testsuite (`npm test`), PII/secret-scan en site-build (`npm run build`) zijn geslaagd.
            - Controleer `data/agent-telemetry.json` voor live websearch-status en kosten vóór merge naar `main`.
          branch: "weekly/cloud-expansion"
          delete-branch: true
