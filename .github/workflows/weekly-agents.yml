name: Weekly AI Knowledge Expansion Agents

on:
  schedule:
    # Elke maandag 07:00 UTC (lokaal Appfigures-script draait apart op dinsdag 08:00 CET)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      agent:
        description: "Welke engine draaien? ('all' voor alle 12 samenwerkende engines)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - money-leak-detector
          - competitor-complaint-miner
          - demand-wtp-validator
          - regulation-deadline-scout
          - distribution-arbitrage-analyst
          - agency-to-saas-builder
          - acquisition-partnership-scout
          - customer-acquisition-sales-strategist
          - pricing-unit-economics-analyst
          - experiment-kill-criteria-analyst
          - evidence-quality-auditor
          - portfolio-capital-allocator
      dry_run:
        description: "Dry-run: geen LLM-aanroepen, geen schrijfacties, geen PR (test van het 'geen bevindingen'-pad)"
        required: false
        default: false
        type: boolean
      pr_branch:
        description: "Optioneel: afwijkende PR-branch (alleen voor geïsoleerde tests). Standaard weekly/cloud-YYYY-WW"
        required: false
        default: ""
        type: string

concurrency:
  group: weekly-agents-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  expand-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine research branch (one per ISO week)
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.pr_branch }}" ]; then
            echo "name=${{ github.event.inputs.pr_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=weekly/cloud-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cooperating weekly expansion engines
        id: run
        env:
          # Dry-run gets no provider keys, so it cannot make billable calls.
          GEMINI_API_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.GEMINI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.OPENROUTER_API_KEY || '' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MAX_RUN_COST_USD: "0.50"
          RUN_SUMMARY_PATH: ${{ runner.temp }}/run-summary.md
        run: |
          TARGET="${{ github.event.inputs.agent || 'all' }}"
          ARGS="--all"
          if [ "$TARGET" != "all" ]; then ARGS="--agent $TARGET"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node agents/run-weekly-expansion.mjs $ARGS
          if [ -f "$RUN_SUMMARY_PATH" ]; then cat "$RUN_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Run full test suite, leak scan & build
        run: npm test && npm run build

      - name: No new findings
        if: steps.run.outputs.has_findings != 'true'
        run: echo "Geen nieuwe bevindingen die de quality gate passeren — geen PR aangemaakt."

      - name: Create or update research Pull Request
        id: cpr
        if: steps.run.outputs.has_findings == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "chore(agents): wekelijkse onderzoeksrun ${{ steps.branch.outputs.name }}"
          title: "Wekelijkse AI Playbook-uitbreiding (${{ steps.branch.outputs.name }})"
          body-path: ${{ runner.temp }}/run-summary.md
          delete-branch: true

      - name: Report PR
        if: steps.cpr.outputs.pull-request-number
        # Block scalar: in a plain YAML scalar " #" would start a comment and truncate the command.
        run: |
          echo "PR #${{ steps.cpr.outputs.pull-request-number }} (${{ steps.cpr.outputs.pull-request-operation }}): ${{ steps.cpr.outputs.pull-request-url }}"
